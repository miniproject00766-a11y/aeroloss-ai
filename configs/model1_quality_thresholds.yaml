# AeroLoss AI — Model 1 Image Quality & Relevance Guardrail Thresholds
# Version: 1.0.0-provisional
# Notice: These thresholds are PROVISIONAL baseline parameters calibrated on the
# existing AeroLoss AI image manifest. They are subject to human review and pilot tuning.

version: "1.0.0-provisional"
status: "PROVISIONAL_CALIBRATED"

resolution:
  min_width_usable: 512
  min_height_usable: 512
  min_width_unusable: 256
  min_height_unusable: 256
  aspect_ratio_min_usable: 0.33
  aspect_ratio_max_usable: 3.00

blur:
  # Measured variance of the Laplacian (cv2.Laplacian(gray, cv2.CV_64F).var())
  # Note: Smooth blade composite surfaces naturally have low background texture.
  # Severely out-of-focus images fall below 1.0.
  laplacian_var_unusable: 1.0
  laplacian_var_review: 5.0
  # Extreme high-frequency cutoff: Pure synthetic random noise exhibits variance > 10,000
  laplacian_var_noise_cutoff: 10000.0

exposure:
  # Dark pixel clipping: Fraction of pixels with grayscale intensity <= 15
  dark_pixel_threshold_unusable: 0.60
  dark_pixel_threshold_review: 0.25
  min_mean_brightness_unusable: 15.0
  min_mean_brightness_review: 30.0

  # Bright pixel clipping: Fraction of pixels with grayscale intensity >= 245
  bright_pixel_threshold_unusable: 0.85
  bright_pixel_threshold_review: 0.35
  max_mean_brightness_unusable: 252.0
  max_mean_brightness_review: 240.0

contrast:
  # Grayscale standard deviation (dynamic range measure)
  min_std_unusable: 2.5
  min_std_review: 10.0
  # Shannon entropy threshold (bits per pixel)
  min_entropy_unusable: 0.50
  min_entropy_review: 2.50

relevance_heuristics:
  # Digital graphics and chart rejection: high white background + low entropy + sharp digital rendering
  chart_bright_fraction_threshold: 0.70
  chart_entropy_max: 2.5
  chart_min_blur_score: 1000.0
  chart_min_line_count: 50
  # Synthetic noise rejection: extreme variance + high entropy + near-zero edges
  noise_entropy_min: 4.5
  noise_blur_min: 10000.0

policy:
  allow_manual_override: true
  conservative_mode: true
  separate_quality_and_relevance: true
